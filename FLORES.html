    <style>
    /* =====================================================
       GIRASOLES, VENTANA DE MENSAJE Y PANEL DE MÚSICA
       (estilos añadidos; no tocan las flores de main.css)
       ===================================================== */
    :root {
      --oro: #ffc83a;
      --oro-claro: #ffe28a;
      --semilla: #2b1405;
      --crema: #fff1cf;
      --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --sans: 'Poppins', system-ui, sans-serif;
    }

    /* ---------- Girasoles flotantes ---------- */
    .girasol {
      --s: clamp(54px, 9vmin, 92px);
      position: fixed;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
      width: var(--s);
      height: var(--s);
      margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      z-index: 900;
      -webkit-tap-highlight-color: transparent;

      opacity: 0;
      scale: .3;
      visibility: hidden;
      transition: opacity .9s ease, scale .9s cubic-bezier(.2, 1.35, .4, 1), visibility 0s;
      animation: girasol-flotar var(--dur, 5s) ease-in-out var(--delay, 0s) infinite alternate;
    }
    .girasol.visible {
      opacity: 1;
      scale: 1;
      visibility: visible;
    }
    .girasol svg {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 10px rgba(255, 190, 0, .5));
      transition: transform .7s cubic-bezier(.2, .8, .2, 1), filter .3s ease;
    }
    .girasol:hover svg,
    .girasol:focus-visible svg {
      transform: rotate(28deg) scale(1.12);
      filter: drop-shadow(0 0 20px rgba(255, 214, 70, .95));
    }
    .girasol:active svg { transform: rotate(28deg) scale(.96); }
    .girasol:focus-visible {
      outline: 2px solid var(--crema);
      outline-offset: 4px;
    }
    @keyframes girasol-flotar {
      from { transform: translateY(0) rotate(-3deg); }
      to   { transform: translateY(-11px) rotate(3deg); }
    }

    /* ---------- Mariquitas que solo cruzan el jardín (adorno) ---------- */
    .mariquitas {
      position: fixed;
      inset: 0;
      z-index: 880;
      overflow: hidden;
      pointer-events: none;
    }
    .vuelo {
      position: absolute;
      top: calc(var(--y) * 1%);
      left: 0;
      width: max-content;
      animation: mariquita-cruzar var(--dur, 30s) linear var(--delay, 0s) infinite;
    }
    .vuelo--vuelta { animation-direction: reverse; }
    .vuelo svg {
      display: block;
      width: var(--s, 24px);
      height: var(--s, 24px);
      filter: drop-shadow(0 4px 9px rgba(0, 0, 0, .55));
      animation: mariquita-ondular var(--bob, 3.4s) ease-in-out infinite alternate;
    }
    @keyframes mariquita-cruzar {
      from { transform: translateX(-14vw); }
      to   { transform: translateX(114vw); }
    }
    @keyframes mariquita-ondular {
      from { transform: translateY(-15px) rotate(-14deg); }
      to   { transform: translateY(15px) rotate(14deg); }
    }

    /* ---------- La mariquita que se puede tocar ---------- */
    .mariquita {
      --s: clamp(46px, 7.6vmin, 76px);
      position: fixed;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
      width: var(--s);
      height: var(--s);
      margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      z-index: 950;
      -webkit-tap-highlight-color: transparent;

      opacity: 0;
      scale: .3;
      visibility: hidden;
      transition: opacity 1s ease, scale 1s cubic-bezier(.2, 1.35, .4, 1), visibility 0s;
      animation: mariquita-flotar 4.2s ease-in-out infinite alternate;
    }
    .mariquita.visible {
      opacity: 1;
      scale: 1;
      visibility: visible;
    }
    /* halo que late, para que se note que esta guarda algo distinto */
    .mariquita::after {
      content: '';
      position: absolute;
      inset: -20%;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 64, 44, .38), transparent 66%);
      animation: mariquita-latido 2.8s ease-in-out infinite;
      pointer-events: none;
    }
    .mariquita svg {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px rgba(255, 64, 44, .55));
      transition: transform .7s cubic-bezier(.2, .8, .2, 1), filter .3s ease;
    }
    .mariquita:hover svg,
    .mariquita:focus-visible svg {
      transform: rotate(-18deg) scale(1.14);
      filter: drop-shadow(0 0 22px rgba(255, 84, 62, .95));
    }
    .mariquita:active svg { transform: rotate(-18deg) scale(.96); }
    .mariquita:focus-visible {
      outline: 2px solid var(--crema);
      outline-offset: 4px;
    }
    @keyframes mariquita-flotar {
      from { transform: translateY(0) rotate(-5deg); }
      to   { transform: translateY(-13px) rotate(5deg); }
    }
    @keyframes mariquita-latido {
      0%, 100% { opacity: .22; transform: scale(.85); }
      50%      { opacity: .68; transform: scale(1.16); }
    }

    /* ---------- Ventana del mensaje ---------- */
    .carta-fondo {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0);
      -webkit-backdrop-filter: blur(0);
              backdrop-filter: blur(0);
      transition: background .35s ease, backdrop-filter .35s ease, -webkit-backdrop-filter .35s ease;
    }
    .carta-fondo[hidden] { display: none; }
    .carta-fondo.abierta {
      background: rgba(0, 0, 0, .68);
      -webkit-backdrop-filter: blur(6px);
              backdrop-filter: blur(6px);
    }

    .carta {
      position: relative;
      width: min(94vw, 540px);
      padding: 46px clamp(24px, 6vw, 46px) 34px;
      color: var(--crema);
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(255, 200, 58, .14), transparent 60%),
        linear-gradient(165deg, #2a1707 0%, #170c03 100%);
      border: 1px solid rgba(255, 200, 58, .45);
      border-radius: 26px;
      box-shadow:
        0 0 0 7px rgba(255, 200, 58, .06),
        0 30px 80px rgba(0, 0, 0, .75),
        0 0 70px rgba(255, 176, 0, .2);
      text-align: center;

      opacity: 0;
      transform: scale(.35) translateY(14px);
      transition: opacity .3s ease, transform .45s cubic-bezier(.2, 1.05, .3, 1);
    }
    .carta-fondo.abierta .carta {
      opacity: 1;
      transform: none;
    }

    .carta__flor {
      display: block;
      width: 58px;
      height: 58px;
      margin: -84px auto 14px;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .6)) drop-shadow(0 0 14px rgba(255, 190, 0, .5));
    }
    .carta-fondo.abierta .carta__flor { animation: carta-giro 1.4s cubic-bezier(.2, .8, .2, 1) .1s backwards; }
    @keyframes carta-giro { from { transform: rotate(-140deg) scale(.4); } }

    .carta__titulo {
      margin: 0 0 18px;
      padding: 0 30px;
      text-wrap: balance;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 600;
      font-size: clamp(1.9rem, 5vw, 2.5rem);
      line-height: 1.15;
      color: var(--oro-claro);
      text-shadow: 0 0 24px rgba(255, 190, 0, .35);
    }

    .carta__cuerpo {
      max-height: min(46vh, 380px);
      overflow-y: auto;
      padding: 2px 6px;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(1.2rem, 3.2vw, 1.4rem);
      line-height: 1.6;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 200, 58, .5) transparent;
    }
    .carta__cuerpo:focus-visible { outline: 1px dashed rgba(255, 226, 138, .6); outline-offset: 4px; }
    .carta__cuerpo p { margin: 0 0 1em; white-space: pre-line; }
    .carta__cuerpo p:last-child { margin-bottom: 0; }

    .carta__firma {
      margin: 22px 0 0;
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.25rem;
      color: var(--oro);
      text-align: right;
    }
    .carta__firma[hidden] { display: none; }

    .carta__cerrar {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 200, 58, .4);
      border-radius: 50%;
      background: rgba(255, 200, 58, .08);
      color: var(--oro-claro);
      font: 400 24px/1 var(--sans);
      cursor: pointer;
      transition: background .2s ease, transform .3s ease;
    }
    .carta__cerrar:hover { background: rgba(255, 200, 58, .22); transform: rotate(90deg); }
    .carta__cerrar:focus-visible { outline: 2px solid var(--crema); outline-offset: 3px; }

    /* ---------- La carta cuando la abre la mariquita (en rojo) ---------- */
    .carta-fondo--roja .carta {
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(255, 74, 52, .17), transparent 60%),
        linear-gradient(165deg, #2d0b08 0%, #150403 100%);
      border-color: rgba(255, 96, 72, .5);
      box-shadow:
        0 0 0 7px rgba(255, 74, 52, .07),
        0 30px 80px rgba(0, 0, 0, .78),
        0 0 70px rgba(214, 40, 28, .3);
    }
    .carta-fondo--roja .carta__flor {
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .6)) drop-shadow(0 0 14px rgba(255, 74, 52, .6));
    }
    .carta-fondo--roja .carta__titulo {
      color: #ffb6a8;
      text-shadow: 0 0 24px rgba(255, 74, 52, .4);
    }
    .carta-fondo--roja .carta__firma { color: #ff8068; }
    .carta-fondo--roja .carta__cuerpo { scrollbar-color: rgba(255, 96, 72, .5) transparent; }
    .carta-fondo--roja .carta__cerrar {
      border-color: rgba(255, 96, 72, .45);
      background: rgba(255, 96, 72, .1);
      color: #ffb6a8;
    }
    .carta-fondo--roja .carta__cerrar:hover { background: rgba(255, 96, 72, .24); }

    /* ---------- Panel de música ---------- */
    .musica {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: max-content;
      max-width: 94vw;
    }
    .musica__botones {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(12, 8, 3, .6);
      border: 1px solid rgba(255, 208, 80, .32);
      border-radius: 999px;
      -webkit-backdrop-filter: blur(8px);
              backdrop-filter: blur(8px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
    }
    .musica__btn {
      position: relative;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 208, 80, .5);
      border-radius: 50%;
      background: transparent;
      color: var(--oro-claro);
      font: 500 15px/1 var(--sans);
      cursor: pointer;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .musica__btn:hover { background: rgba(255, 208, 80, .16); }
    /* el primer botón (música de fondo) va separado de los números */
    .musica__btn--fondo { margin-right: 8px; }
    .musica__btn--fondo::after {
      content: '';
      position: absolute;
      right: -9px;
      top: 22%;
      height: 56%;
      width: 1px;
      background: rgba(255, 208, 80, .35);
    }
    .musica__btn .num svg { display: block; width: 24px; height: 24px; }
    .musica__btn:focus-visible { outline: 2px solid var(--crema); outline-offset: 2px; }
    .musica__btn.activa {
      background: var(--oro);
      color: var(--semilla);
      border-color: var(--oro);
      box-shadow: 0 0 16px rgba(255, 200, 58, .65);
    }
    .musica__btn .eq,
    .musica__btn .play { display: none; }
    .musica__btn.activa .num { display: none; }
    .musica__btn.activa.sonando .eq { display: flex; }
    .musica__btn.activa:not(.sonando) .play { display: block; }

    .musica__btn .eq {
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }
    .musica__btn .eq i {
      display: block;
      width: 3px;
      height: 100%;
      background: currentColor;
      border-radius: 1px;
      transform-origin: bottom;
      animation: musica-barra .9s ease-in-out infinite alternate;
    }
    .musica__btn .eq i:nth-child(2) { animation-delay: -.3s; animation-duration: .7s; }
    .musica__btn .eq i:nth-child(3) { animation-delay: -.6s; animation-duration: 1.1s; }
    @keyframes musica-barra { from { transform: scaleY(.25); } to { transform: scaleY(1); } }

    .musica__btn .play {
      width: 0;
      height: 0;
      margin-left: 3px;
      border-style: solid;
      border-width: 7px 0 7px 11px;
      border-color: transparent transparent transparent currentColor;
    }

    .musica__estado,
    .pista {
      margin: 0;
      max-width: 88vw;
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: 1.1rem;
      line-height: 1.25;
      color: var(--oro-claro);
      text-shadow: 0 1px 8px #000, 0 0 14px rgba(0, 0, 0, .8);
    }
    .musica__estado:empty { display: none; }
    .musica__estado.aviso { color: #ffb4a0; }
    .pista {
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }
    .pista.ver { opacity: .9; }

    @media (max-width: 420px) {
      .musica__botones { gap: 6px; padding: 7px 10px; }
      .musica__btn { width: 36px; height: 36px; }
      .musica__btn--fondo { margin-right: 6px; }
      .musica__btn--fondo::after { right: -7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .girasol,
      .girasol svg,
      .mariquita,
      .mariquita svg,
      .mariquita::after,
      .vuelo,
      .vuelo svg,
      .carta,
      .carta-fondo,
      .carta__flor,
      .musica__btn .eq i,
      .pista { animation: none !important; transition-duration: .01s !important; }
      /* sin animación no tiene sentido que las de adorno se queden amontonadas */
      .mariquitas { display: none; }
    }
    </style>

</head>

    /* ---------- 1) Los 6 girasoles y sus mensajes ----------
       titulo : encabezado de la ventana
       texto  : el mensaje. Deja una línea EN BLANCO para separar párrafos.
                Un salto de línea simple también se respeta.
                (Escríbelo entre comillas invertidas ` ` y no uses ` dentro del texto)
       firma  : línea final (déjala "" si no quieres firma)
       x, y   : posición del girasol en pantalla, en % (x: 0 = izquierda, 100 = derecha;
                y: 0 = arriba, 100 = abajo). Muévelos si tapan alguna flor. */
    const GIRASOLES = [
      { // Girasol 1
        titulo: "Gracias",
        texto: `Gracias por este mes, Jessi.

Por las conversaciones que se alargan sin que ninguno se de cuenta, por hacerme reir los dias en que no tenia muchas ganas, y hasta por mandarme a la mierda con toda la confianza del mundo. Eso tambien es cariño, aunque no lo parezca.

Un mes es poco tiempo para casi todo. Menos para darse cuenta de que alguien te importa de verdad.`,
        firma: "",
        x: 9, y: 20
      },
      { // Girasol 2
        titulo: "Lo que más me gusta de ti",
        texto: `Que eres rarita. Asi, sin adornos, porque lo digo como un elogio. Rarita de la que dice lo que piensa, de la que sale con cosas que a nadie mas se le ocurrirían, de la que no encaja en el molde aburrido de los demas. Nunca se me haria normal hablar contigo, y eso me encanta.

Que eres inteligente y se te nota sin que tengas que estar demostrandolo. Discutes con una seguridad que da miedo y da gracia al mismo tiempo. Vas a ser una abogada tremenda, de eso no tengo ninguna duda.

Que me haces reir. Eso vale muchisimo mas de lo que crees, porque no cualquiera lo consigue.

Y que cuando bailas se te olvida todo lo demas. Ahi eres tu al cien por ciento, sin filtro y sin pedirle permiso a nadie. Creo que esa es la version tuya que mas me gusta.`,
        firma: "",
        x: 91, y: 18
      },
      { // Girasol 3
        titulo: "Un recuerdo",
        texto: `Todavia no tenemos muchos recuerdos juntos, y me gusta pensarlo asi: significa que casi todos estan por venir.

Pero si me quedo con algo de este mes, me quedo con las veces que te reiste de una tonteria que dije sin pensarla, con las conversaciones que empezaron en cualquier bobada y terminaron a una hora que ninguno de los dos queria admitir, y con lo facil que se me hace estar contigo.

No hace falta que pase nada extraordinario. Contigo el rato mas normal del mundo ya vale la pena.`,
        firma: "",
        x: 20, y: 37
      },
      { // Girasol 4
        titulo: "Lo que deseo para ti",
        texto: `Que termines Derecho y seas esa abogada que no se deja pisar por nadie, la que entra a una sala con la razon de su lado y sale ganando.

Que consigas todo lo que te propongas, aunque en el camino te toque aguantar a gente que no te llega ni a los talones.

Que no se te apague nunca lo rarita, porque es justo eso lo que te hace distinta a todas las demas.

Que bailes mucho. Que no dejes de bailar por nada ni por nadie.

Y que encuentres gente que sepa valorarte. Nunca aceptes menos de lo que mereces, que es bastante mas de lo que crees.

"Y si un día no encuentras el sol, baila igual".`,
        firma: "",
        x: 76, y: 35
      },
      { // Girasol 5
        titulo: "Por si un día dudas",
        texto: `Se que algun dia vas a dudar de ti. Nos pasa a todos, y a la gente inteligente todavia mas, porque se cuestiona hasta lo que ya hizo bien.

Asi que dejo esto aqui por si alguna vez lo necesitas: eres mucho mas capaz de lo que crees, mucho mas graciosa de lo que tu misma te tomas en serio, y mucho mas querida de lo que te imaginas.

Y si un dia se te viene todo encima, me avisas. Porque tu eres mi curita, pero eso tiene que funcionar en los dos sentidos.

"No tienes que ser menos rara para que te quieran. Justo al revés".`,
        firma: "",
        x: 10, y: 53
      },
      { // Girasol 6
        titulo: "Por qué hice esto",
        texto: `Estas flores no se marchitan. Se quedan aqui, encendidas, esperandote cada vez que quieras volver.

No hay ninguna ocasion especial. No es tu cumpleaños ni una fecha ni nada. Solo queria que tuvieras algo que fuera tuyo y de nadie mas.

Y si llegaste hasta aqui, todavia te falta uno. El rojo.`,
        firma: "",
        x: 90, y: 51
      }
    ];

    /* ---------- 1.5) La mariquita ----------
       Aparece en el centro después de los girasoles, con un halo rojo que late.
       Es el último mensaje, el que ella va a encontrar al final.
       Mismos campos que arriba. Ponla en false si algún día no la quieres. */
    const MOSTRAR_MARIQUITA = true;

    const MARIQUITA = {
      titulo: "Lo que me recordó a ti",
      texto: `Dicen que cuando una mariquita se te posa en la mano tienes que pedir un deseo antes de que vuele.

Yo ya pedí el mío hace como un mes, sin darme cuenta.

Siempre me gustó que Marinette sea así: torpe, que se traba, que se pone nerviosa y que nunca encuentra las palabras justo cuando más falta le hacen. Y que aun así, cuando de verdad importa, sea la más valiente de todas. Nunca tuvo que dejar de ser ella para ser extraordinaria.

Algo parecido me pasa contigo: a veces no encuentro las palabras, pero tengo clarísimo lo que quiero decir.

Ladybug lanza su amuleto al aire cuando todo parece perdido, y cae justo lo que hacía falta. Yo creo que la suerte no cae del cielo, se reconoce cuando aparece. Y yo te reconocí.

Todavía no sé qué somos, y no tengo ninguna prisa por ponerle nombre. Solo sé que este mes hablando contigo ha sido lo mejor que me ha pasado en mucho tiempo, y que ver tu nombre en la pantalla me arregla el día.`,
      firma: "— Y si algún día se te acaba la suerte, yo te presto la mía",
      x: 50, y: 30
    };

    /* ---------- 2) Las canciones (6 en total) ----------
       archivo : nombre del mp3 (debe existir en la carpeta indicada abajo)
       titulo  : el nombre que se muestra debajo del panel

       CANCION_FONDO → suena sola al entrar al jardín. Es el primer botón del panel (el de la flor).
       CANCIONES     → las otras 5, que la persona puede elegir después (botones 1 al 5). */
    const CANCION_FONDO = { archivo: "Floricienta.mp3", titulo: "Floricienta - flores amarillas" };

    const CANCIONES = [
      { archivo: "cancion1.mpeg", titulo: "Acuerdate de mi" },
      { archivo: "cancion2.mpeg", titulo: "Pareja del año" },
      { archivo: "cancion3.mpeg", titulo: "Terapia" },
      { archivo: "cancion4.mpeg", titulo: "Faltas tú" },
      { archivo: "cancion5.mpeg", titulo: "Cuando nadie ve" }
    ];

    /* Carpeta donde están los 6 mp3, relativa a este archivo.
       "img/"    → dentro de la carpeta img  (así está ahora)
       ""        → junto a FLORES.html
       "musica/" → dentro de una carpeta llamada musica  (no olvides la "/" final) */
    const CARPETA_MUSICA = "img/";

    const VOLUMEN = 0.7;                 // 0 (mudo) a 1 (máximo)
    const SIGUIENTE_AL_TERMINAR = true;  // true: al acabar una de las 5 canciones pasa a la siguiente;
                                         //       tras la 5 vuelve Floricienta
                                         // false: la canción elegida se repite en bucle
                                         // (Floricienta, la de fondo, siempre se repite en bucle)

    /* ============================================================
       FIN DE LO EDITABLE — el resto es la lógica, no hace falta tocarla
       ============================================================ */
    </script>

    <script>
    (function () {
      'use strict';

      var $ = function (s, r) { return (r || document).querySelector(s); };
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var SVG_NS = 'http://www.w3.org/2000/svg';
      var POS_DEFECTO = [[9, 20], [91, 18], [20, 37], [76, 35], [10, 53], [90, 51]];

      function icono(clase, simbolo) {
        var svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('aria-hidden', 'true');
        if (clase) svg.setAttribute('class', clase);
        var use = document.createElementNS(SVG_NS, 'use');
        use.setAttribute('href', simbolo || '#girasol');
        svg.appendChild(use);
        return svg;
      }

      /* ---------------- Ventana del mensaje ---------------- */
      var fondo = $('#carta');
      var carta = $('.carta', fondo);
      var tituloEl = $('#carta-titulo');
      var cuerpo = $('.carta__cuerpo', fondo);
      var firmaEl = $('.carta__firma', fondo);
      var florUse = $('.carta__flor use', fondo);
      var btnCerrar = $('.carta__cerrar', fondo);
      var pista = $('#pista');
      var ultimoBoton = null;
      var timerCierre = null;
      var pistaTimer = null;

      function parrafos(texto) {
        return String(texto || '').split(/\n\s*\n/).map(function (t) {
          return t.trim();
        }).filter(Boolean).map(function (t) {
          var p = document.createElement('p');
          p.textContent = t;
          return p;
        });
      }

      function ocultarPista() {
        clearTimeout(pistaTimer);
        pista.classList.remove('ver');
      }

      /* g = el mensaje; roja = true solo para la mariquita (cambia el color y el icono) */
      function abrir(g, boton, roja) {
        if (!g) return;
        clearTimeout(timerCierre);
        ocultarPista();

        fondo.classList.toggle('carta-fondo--roja', !!roja);
        florUse.setAttribute('href', roja ? '#mariquita' : '#girasol');
        tituloEl.textContent = g.titulo || '';
        cuerpo.textContent = '';
        parrafos(g.texto).forEach(function (p) { cuerpo.appendChild(p); });
        firmaEl.textContent = g.firma || '';
        firmaEl.hidden = !g.firma;
        ultimoBoton = boton;

        fondo.hidden = false;
        /* la ventana "nace" desde el girasol que tocaste */
        var rb = boton.getBoundingClientRect();
        var rf = fondo.getBoundingClientRect();
        var ox = rb.left + rb.width / 2 - rf.left - carta.offsetLeft;
        var oy = rb.top + rb.height / 2 - rf.top - carta.offsetTop;
        carta.style.transformOrigin = ox + 'px ' + oy + 'px';

        void fondo.offsetWidth; /* fuerza el reflow para que la transición arranque */
        fondo.classList.add('abierta');
        cuerpo.scrollTop = 0;
        btnCerrar.focus({ preventScroll: true });
      }

      function cerrar() {
        if (fondo.hidden) return;
        fondo.classList.remove('abierta');
        timerCierre = setTimeout(function () { fondo.hidden = true; }, reduce ? 0 : 340);
        if (ultimoBoton) ultimoBoton.focus({ preventScroll: true });
      }

      btnCerrar.addEventListener('click', cerrar);
      fondo.addEventListener('click', function (e) { if (e.target === fondo) cerrar(); });
      document.addEventListener('keydown', function (e) {
        if (fondo.hidden) return;
        if (e.key === 'Escape') { cerrar(); return; }
        if (e.key === 'Tab') {
          var f = [btnCerrar, cuerpo];
          var i = f.indexOf(document.activeElement);
          if (i === -1) { e.preventDefault(); f[0].focus(); }
          else if (e.shiftKey && i === 0) { e.preventDefault(); f[f.length - 1].focus(); }
          else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
        }
      });

      /* ---------------- Girasoles flotantes ---------------- */
      var contenedor = $('#girasoles');
      GIRASOLES.forEach(function (g, i) {
        var d = POS_DEFECTO[i] || [50, 30];
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'girasol';
        b.title = g.titulo || '';
        b.setAttribute('aria-label', 'Abrir mensaje: ' + (g.titulo || 'girasol ' + (i + 1)));
        b.style.setProperty('--x', isFinite(g.x) && g.x !== null ? g.x : d[0]);
        b.style.setProperty('--y', isFinite(g.y) && g.y !== null ? g.y : d[1]);
        b.style.setProperty('--dur', (4.6 + (i % 3) * 0.7) + 's');
        b.style.setProperty('--delay', (-i * 0.9) + 's');
        b.appendChild(icono());
        b.addEventListener('click', function () { abrir(GIRASOLES[i], b, false); });
        contenedor.appendChild(b);
        /* aparecen cuando las flores terminan de florecer */
        setTimeout(function () { b.classList.add('visible'); }, reduce ? 0 : 4200 + i * 320);
      });

      /* ---------------- La mariquita ---------------- */
      var hayMariquita = typeof MOSTRAR_MARIQUITA !== 'undefined' && MOSTRAR_MARIQUITA &&
                         typeof MARIQUITA === 'object' && MARIQUITA;

      if (hayMariquita) {
        var mb = document.createElement('button');
        mb.type = 'button';
        mb.className = 'mariquita';
        mb.title = MARIQUITA.titulo || '';
        mb.setAttribute('aria-label', 'Abrir mensaje: ' + (MARIQUITA.titulo || 'la mariquita'));
        mb.style.setProperty('--x', isFinite(MARIQUITA.x) && MARIQUITA.x !== null ? MARIQUITA.x : 50);
        mb.style.setProperty('--y', isFinite(MARIQUITA.y) && MARIQUITA.y !== null ? MARIQUITA.y : 30);
        mb.appendChild(icono(null, '#mariquita'));
        mb.addEventListener('click', function () { abrir(MARIQUITA, mb, true); });
        contenedor.appendChild(mb);
        /* llega la última, cuando los seis girasoles ya están */
        setTimeout(function () { mb.classList.add('visible'); }, reduce ? 0 : 7400);
      }

      /* mariquitas de adorno: cruzan el jardín despacio, de lado a lado */
      var cielo = $('#mariquitas');
      [
        { y: 14, s: 20, dur: 34, delay: -6,  bob: 3.1, vuelta: false },
        { y: 44, s: 27, dur: 46, delay: -22, bob: 4.2, vuelta: true  },
        { y: 68, s: 17, dur: 39, delay: -13, bob: 2.7, vuelta: false },
        { y: 84, s: 23, dur: 52, delay: -31, bob: 3.8, vuelta: true  }
      ].forEach(function (m) {
        var v = document.createElement('div');
        v.className = 'vuelo' + (m.vuelta ? ' vuelo--vuelta' : '');
        v.style.setProperty('--y', m.y);
        v.style.setProperty('--s', m.s + 'px');
        v.style.setProperty('--dur', m.dur + 's');
        v.style.setProperty('--delay', m.delay + 's'); /* negativo: ya vienen en camino */
        v.style.setProperty('--bob', m.bob + 's');
        v.appendChild(icono(null, '#mariquita'));
        cielo.appendChild(v);
      });

      /* pistas suaves, solo al principio: primero los girasoles, luego la mariquita */
      pistaTimer = setTimeout(function () {
        pista.classList.add('ver');
        pistaTimer = setTimeout(function () {
          pista.classList.remove('ver');
          if (!hayMariquita) return;
          pistaTimer = setTimeout(function () {
            pista.textContent = 'La mariquita guarda el último';
            pista.classList.add('ver');
            pistaTimer = setTimeout(ocultarPista, 11000);
          }, 1500);
        }, 11000);
      }, reduce ? 0 : 6500);

      /* ---------------- Música ---------------- */
      var audio = $('#reproductor');
      var panel = $('#musica-botones');
      var estado = $('#musica-estado');
      var LISTA = [CANCION_FONDO].concat(CANCIONES); /* posición 0 = música de fondo */
      var actual = -1;
      var bloqueado = false; /* el navegador impidió el autoplay */
      var fallo = false;     /* no se encontró el archivo */
      var botones = [];

      audio.volume = VOLUMEN;

      function pintar() {
        botones.forEach(function (b, i) {
          var act = i === actual;
          b.classList.toggle('activa', act);
          b.classList.toggle('sonando', act && !audio.paused && !fallo);
          b.setAttribute('aria-pressed', act ? 'true' : 'false');
        });
        var c = LISTA[actual];
        var msg = '';
        if (fallo && c) msg = 'No encuentro ' + CARPETA_MUSICA + c.archivo;
        else if (bloqueado) msg = 'Toca la pantalla para activar la música';
        else if (c) msg = c.titulo || '';
        estado.textContent = msg;
        estado.classList.toggle('aviso', !!fallo);
      }

      function reproducir() {
        var p = audio.play();
        if (p && p.then) {
          p.then(function () { bloqueado = false; pintar(); })
           .catch(function (err) {
             if (err && err.name === 'NotAllowedError') bloqueado = true;
             pintar();
           });
        }
      }

      function ir(i) {
        actual = i;
        fallo = false;
        audio.src = CARPETA_MUSICA + LISTA[i].archivo;
        pintar();
        reproducir();
      }

      LISTA.forEach(function (c, i) {
        var esFondo = i === 0;
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'musica__btn' + (esFondo ? ' musica__btn--fondo' : '');
        b.title = c.titulo || '';
        b.setAttribute('aria-label', (esFondo ? 'Música de fondo' : 'Canción ' + i) + ': ' + (c.titulo || c.archivo));
        b.setAttribute('aria-pressed', 'false');
        b.innerHTML = '<span class="num">' +
                        (esFondo ? '<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#girasol"/></svg>' : i) +
                      '</span>' +
                      '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>' +
                      '<span class="play" aria-hidden="true"></span>';
        b.addEventListener('click', function () {
          if (bloqueado) { reproducir(); return; }           /* primer toque: activa el sonido */
          if (i === actual && !fallo) {                       /* misma canción: pausa / reanuda */
            if (audio.paused) reproducir(); else audio.pause();
          } else {
            ir(i);
          }
        });
        panel.appendChild(b);
        botones.push(b);
      });

      audio.addEventListener('play', pintar);
      audio.addEventListener('pause', pintar);
      audio.addEventListener('error', function () { fallo = true; pintar(); });
      audio.addEventListener('ended', function () {
        if (actual === 0 || !SIGUIENTE_AL_TERMINAR) {   /* la de fondo (o cualquiera, si se pidió bucle) se repite */
          audio.currentTime = 0;
          reproducir();
        } else {
          ir(actual === LISTA.length - 1 ? 0 : actual + 1); /* tras la 5 vuelve la de fondo */
        }
      });

      /* Si el navegador bloqueó el autoplay, el primer toque en cualquier parte lo activa */
      function desbloquear(e) {
        if (bloqueado && !(e.target.closest && e.target.closest('.musica__btn'))) reproducir();
      }
      document.addEventListener('pointerup', desbloquear);
      document.addEventListener('keydown', desbloquear);

      ir(0); /* al entrar al jardín suena la música de fondo */
    })();
    </script>

    <script src="main.js"></script>

</body>
</html>
