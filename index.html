<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <!-- Que no la indexen los buscadores: el link solo lo tiene ella -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/png">
    <title>Un jardín para ti</title>

    <style>
        /* Ajustes de esta página (encima de css/style.css) */
        :root {
            --crema: #fff1cf;
            --oro: #ffc83a;
            --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        }

        body {
            box-sizing: border-box;
            margin: 0;
            height: auto;
            min-height: 100vh;
            padding: 32px 20px;
            text-align: center;
            background: radial-gradient(ellipse at 50% 42%, #2b2000 0%, #0d0a00 48%, #000 78%);
        }

        /* Las frases usan la serif cursiva: se leen como una carta */
        .description {
            margin: 0;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 500;
            color: var(--crema);
        }
        .description span { font-family: inherit; }

        .intro { font-size: 1.9rem; margin-bottom: 6px; }
        .cierre { font-size: 1.9rem; margin: 6px 0 22px; text-wrap: balance; }

        /* El nombre: el brillo de style.css recorre las letras en cadena.
           style.css ya trae los retrasos hasta la quinta letra. Si algún día
           pones un nombre más largo, añade aquí nth-child(6), (7), etc. */
        .greetings { margin: 4px 0; letter-spacing: .06em; }

        .nota {
            max-width: 44ch;
            text-wrap: balance;
            margin: 0 auto 30px;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 500;
            font-size: 1.3rem;
            line-height: 1.45;
            color: #d9c89a;
        }

        /* Botón de entrada (antes un <a> dentro de un <button>) */
        .button .enter {
            display: inline-block;
            padding: 13px 34px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: .02em;
            text-decoration: none;
            color: #2b1405;
            background: linear-gradient(180deg, #ffe066, #ffbf1f);
            border-radius: 999px;
            box-shadow: 0 0 18px rgba(255, 200, 58, .45);
            transition: box-shadow .3s ease, transform .3s ease;
        }
        .button .enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 34px rgba(255, 214, 70, .85);
        }
        .button .enter:focus-visible { outline: 2px solid var(--crema); outline-offset: 4px; }

        /* La mariquita que espera bajo el botón */
        .mariquita-intro {
            display: block;
            width: 42px;
            height: 42px;
            margin: 34px auto 0;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .6)) drop-shadow(0 0 16px rgba(255, 64, 44, .45));
        }

        /* Entrada escalonada al abrir la página */
        @keyframes aparecer { from { opacity: 0; transform: translateY(10px); } }
        .reveal { animation: aparecer 1.1s ease var(--d, 0s) backwards; }

        /* Se balancea despacio, como si estuviera posada */
        @keyframes mecerse {
            from { transform: translateY(0) rotate(-7deg); }
            to   { transform: translateY(-7px) rotate(7deg); }
        }
        .mariquita-intro { animation: aparecer 1.1s ease var(--d, 0s) backwards, mecerse 3.6s ease-in-out 5.3s infinite alternate; }

        @media screen and (max-width: 574px) {
            .intro, .cierre { font-size: 1.5rem; }
            .greetings { font-size: clamp(1.3rem, 7.2vw, 2.3rem); }
            .nota { font-size: 1.15rem; }
            .button .enter { font-size: .95rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .reveal,
            .mariquita-intro { animation: none; }
            .button .enter { transition: none; }
        }
    </style>
</head>
<body>

    <!-- 1) Frase de inicio: se lee seguida con la palabra brillante de abajo -->
    <div class="description intro reveal" style="--d: .2s">
        <span>Para la rarita más simpática que conozco</span>
    </div>

    <!-- 2) Palabra principal (cada letra brilla en cadena) -->
    <div class="greetings reveal" style="--d: .9s" role="img" aria-label="Jessi">
        <span>J</span>
        <span>E</span>
        <span>S</span>
        <span>S</span>
        <span>I</span>
    </div>

    <!-- 3) Cierre de la frase -->
    <div class="description cierre reveal" style="--d: 1.8s">
        <span>Noctes pulchrae.</span>
    </div>

    <!-- 4) Nota y botón -->
    <p class="nota reveal" style="--d: 2.6s">
        Algunas flores se marchitan.<br>
        Algunos recuerdos no.
    </p>

    <div class="button reveal" style="--d: 3.2s">
        <a class="enter" href="FLORES.html">Entrar al jardín</a>
    </div>

    <!-- 5) Una mariquita esperando abajo: el primer guiño -->
    <svg class="mariquita-intro reveal" style="--d: 4.2s" viewBox="0 0 100 100" role="img" aria-label="Una mariquita">
        <radialGradient id="mq-intro" cx="36%" cy="28%" r="78%">
            <stop offset="0%" stop-color="#ff5545"/>
            <stop offset="55%" stop-color="#df2219"/>
            <stop offset="100%" stop-color="#9e110c"/>
        </radialGradient>
        <path d="M42 21 C37 12, 32 8, 27 5.5" fill="none" stroke="#150f0b" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M58 21 C63 12, 68 8, 73 5.5" fill="none" stroke="#150f0b" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="26.2" cy="5" r="3.1" fill="#150f0b"/>
        <circle cx="73.8" cy="5" r="3.1" fill="#150f0b"/>
        <path d="M25 43 L10 34 M22 59 L6 58 M26 73 L13 84" fill="none" stroke="#150f0b" stroke-width="2.9" stroke-linecap="round"/>
        <path d="M75 43 L90 34 M78 59 L94 58 M74 73 L87 84" fill="none" stroke="#150f0b" stroke-width="2.9" stroke-linecap="round"/>
        <ellipse cx="50" cy="27" rx="19" ry="14.5" fill="#150f0b"/>
        <circle cx="42.5" cy="25" r="3.3" fill="#fff" opacity=".92"/>
        <circle cx="57.5" cy="25" r="3.3" fill="#fff" opacity=".92"/>
        <ellipse cx="50" cy="58" rx="31" ry="33" fill="url(#mq-intro)" stroke="#7e0f0a" stroke-width="1"/>
        <path d="M50 26 L50 90" stroke="#150f0b" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="34" cy="45" r="6.5" fill="#150f0b"/>
        <circle cx="66" cy="45" r="6.5" fill="#150f0b"/>
        <circle cx="30.5" cy="66" r="5.3" fill="#150f0b"/>
        <circle cx="69.5" cy="66" r="5.3" fill="#150f0b"/>
        <circle cx="42" cy="81" r="4.1" fill="#150f0b"/>
        <circle cx="58" cy="81" r="4.1" fill="#150f0b"/>
        <ellipse cx="36" cy="41" rx="8.5" ry="5" fill="#fff" opacity=".2" transform="rotate(-30 36 41)"/>
    </svg>
</body>
</html>
